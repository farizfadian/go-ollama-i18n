name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Never publish a release from a broken tree.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist

          build() {
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "${LDFLAGS}" -o "dist/$3" .
          }

          build windows amd64 go-ollama-i18n-windows-amd64.exe
          build windows arm64 go-ollama-i18n-windows-arm64.exe
          build linux   amd64 go-ollama-i18n-linux-amd64
          build linux   arm64 go-ollama-i18n-linux-arm64
          build darwin  amd64 go-ollama-i18n-macos-amd64
          build darwin  arm64 go-ollama-i18n-macos-arm64

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
